services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: opengradient_studio
      POSTGRES_USER: opengradient
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD before starting Docker PostgreSQL}
    ports:
      - "127.0.0.1:${DOCKER_PGPORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opengradient -d opengradient_studio"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres_data:
